<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Danh sách tài khoản đã bán - Shop Acc Liqi">
    <title>Danh Sách Acc Đã Bán - Shop Acc Liqi</title>

    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zv0jlmxj/image/upload/r_max/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Spectral:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        body: ['"Be Vietnam Pro"', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        surface: '#1a2336',
                        'bg-dark': '#0a0e17',
                        'bg-elevated': '#121824',
                    },
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="font-body antialiased min-h-screen">
    <div id="toast-container" aria-live="polite"
         class="fixed top-6 right-6 z-[2000] flex flex-col gap-3 max-w-[360px] w-[calc(100vw-3rem)] pointer-events-none">
    </div>

    <header class="site-header sticky top-0 z-[100] bg-[#0b0f17] border-b border-white/5 transition-all">
        <div class="top-bar relative flex justify-between items-center px-4 md:px-10 py-3 bg-[#0b0f17] border-b border-white/5 min-h-[54px]">
            <button type="button" id="mobile-menu-btn" class="mobile-menu-btn md:hidden flex-shrink-0 w-10 h-9 p-1.5 border border-white/18 rounded-lg bg-white/5 hover:bg-white/12 hover:border-amber-500 transition-all z-[2]" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="main-nav">
                <span></span><span></span><span></span>
            </button>

            <a href="../index.html" class="top-bar-logo hidden" aria-label="Trang chủ">Shop Acc Liqi</a>

            <nav id="main-nav" class="nav-links hidden md:flex items-center gap-7">
                <a href="../index.html" class="nav-item text-slate-300 hover:text-white text-[0.88rem] font-medium px-1 py-1 transition-colors">Trang chủ</a>
                <a href="danhsachaccban.html" class="nav-item active text-white bg-[#151a24] border border-amber-500/70 text-[0.88rem] font-semibold px-5 py-1.5 rounded-full inline-flex items-center transition-all">Danh sách acc bay</a>
                <a href="naptien.html" class="nav-item text-slate-300 hover:text-white text-[0.88rem] font-medium px-1 py-1 transition-colors">Nạp tiền</a>
                <a href="lichsumuanick.html" class="nav-item text-slate-300 hover:text-white text-[0.88rem] font-medium px-1 py-1 transition-colors">Lịch sử mua nick</a>
                <a href="baiviet.html" class="nav-item text-slate-300 hover:text-white text-[0.88rem] font-medium px-1 py-1 transition-colors">Bài viết hướng dẫn</a>
                <a href="lienhe.html" class="nav-item text-slate-300 hover:text-white text-[0.88rem] font-medium px-1 py-1 transition-colors">Thông tin liên hệ</a>
            </nav>

            <div id="auth-actions" class="absolute right-4 top-0 h-[54px] flex items-center z-[3] md:static md:h-auto">
                <button id="login-btn" class="btn btn-secondary inline-flex items-center gap-2 px-5 py-1.5 rounded-full font-bold text-[0.85rem] bg-white/10 text-white border border-white/15 hover:bg-white/20 transition-all whitespace-nowrap">Đăng Nhập</button>
            </div>

            <div id="user-profile-top" class="user-profile-top hidden relative items-center gap-3 cursor-pointer p-0 bg-transparent border-0 absolute right-4 md:static z-[2]">
                <img class="user-avatar w-9 h-9 rounded-full object-cover border-2 border-amber-500 shadow-sm" src="https://res.cloudinary.com/zv0jlmxj/image/upload/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png" alt="Avatar">
                <div class="user-details flex flex-col text-white text-[0.85rem] leading-tight">
                    <span id="user-display" class="user-name font-bold tracking-wide max-w-[120px] truncate md:max-w-none"></span>
                    <span class="user-balance text-[0.78rem] font-bold text-amber-400"><strong id="wallet-balance-display" class="text-amber-400 font-bold">0đ</strong></span>
                </div>
                <div id="admin-menu-dropdown" class="admin-menu-dropdown hidden absolute top-[calc(100%+10px)] right-0 min-w-[230px] bg-[#121824] border border-amber-500/35 rounded-2xl p-2 z-[120] flex flex-col gap-1 shadow-[0_18px_44px_rgba(0,0,0,0.8)] backdrop-blur-xl">
                    <button type="button" id="add-acc-btn" class="admin-menu-item admin-only-menu-item w-full bg-transparent border-none text-slate-100 px-3.5 py-2.5 text-left rounded-lg text-[0.88rem] font-semibold cursor-pointer hover:bg-amber-500/15 hover:text-amber-400 hover:translate-x-1 transition-all flex items-center gap-2">➕ Thêm acc mới</button>
                    <button type="button" id="manage-users-btn" class="admin-menu-item admin-only-menu-item w-full bg-transparent border-none text-slate-100 px-3.5 py-2.5 text-left rounded-lg text-[0.88rem] font-semibold cursor-pointer hover:bg-amber-500/15 hover:text-amber-400 hover:translate-x-1 transition-all flex items-center gap-2">👤 Quản lý người dùng</button>
                    <button type="button" id="change-password-btn" class="admin-menu-item profile-menu-item w-full bg-transparent border-none text-slate-100 px-3.5 py-2.5 text-left rounded-lg text-[0.88rem] font-semibold cursor-pointer hover:bg-amber-500/15 hover:text-amber-400 hover:translate-x-1 transition-all flex items-center gap-2">🔐 Đổi mật khẩu</button>
                    <button type="button" id="profile-logout-btn" class="admin-menu-item profile-menu-item profile-logout-item w-full bg-transparent border-none text-rose-300 px-3.5 py-3 text-left rounded-lg text-[0.88rem] font-semibold cursor-pointer hover:bg-rose-500/15 hover:text-rose-400 hover:translate-x-1 transition-all flex items-center gap-2 mt-1 pt-3 border-t border-white/8">↪ Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1340px] mx-auto px-4 md:px-8 pt-9 pb-20">
        <h1 class="page-title font-black text-amber-400 text-[1.8rem] mb-6 flex items-center gap-3">📋 Danh Sách Acc Bay</h1>
        <div class="history-page-card bg-gradient-to-b from-[#161d2c]/95 to-[#0d111a]/98 border border-amber-500/30 rounded-2xl p-7 shadow-[0_12px_32px_-6px_rgba(0,0,0,0.65)]">
            <div id="sold-list" class="history-list flex flex-col gap-4">
                <div class="empty-state text-center py-20 text-slate-400 text-lg"><span class="spinner"></span>Đang tải danh sách acc đã bán...</div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const soldList = document.getElementById("sold-list");
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mainNav = document.getElementById("main-nav");
        const loginBtn = document.getElementById("login-btn");
        const authActions = document.getElementById("auth-actions");
        const userProfile = document.getElementById("user-profile-top");
        const userDisplay = document.getElementById("user-display");
        const walletBalance = document.getElementById("wallet-balance-display");
        const profileMenu = document.getElementById("admin-menu-dropdown");
        const profileLogoutBtn = document.getElementById("profile-logout-btn");
        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem("currentUser") || "null"); } catch (_) {}

        if (mobileMenuBtn && mainNav) {
            mobileMenuBtn.addEventListener("click", () => {
                const isOpen = mainNav.classList.toggle("mobile-open");
                mobileMenuBtn.classList.toggle("active", isOpen);
                mobileMenuBtn.setAttribute("aria-expanded", String(isOpen));
            });
            mainNav.querySelectorAll("a").forEach((link) => link.addEventListener("click", () => {
                mainNav.classList.remove("mobile-open");
                mobileMenuBtn.classList.remove("active");
                mobileMenuBtn.setAttribute("aria-expanded", "false");
            }));
        }

        if (loginBtn) loginBtn.addEventListener("click", () => { window.location.href = "dangnhap.html"; });
        if (currentUser) {
            authActions.classList.add("hidden");
            userProfile.classList.remove("hidden");
            userProfile.classList.add("flex");
            userDisplay.textContent = `${currentUser.username}${currentUser.role === "admin" ? " ▾" : ""}`;
            walletBalance.textContent = `${Number(currentUser.balance || 0).toLocaleString("vi-VN")} đ`;
            profileMenu.querySelectorAll(".admin-only-menu-item").forEach((item) => item.classList.toggle("hidden", currentUser.role !== "admin"));
            userProfile.addEventListener("click", (event) => {
                if (!event.target.closest(".profile-menu-item")) profileMenu.classList.toggle("hidden");
            });
            document.addEventListener("click", (event) => {
                if (!userProfile.contains(event.target)) profileMenu.classList.add("hidden");
            });
            profileLogoutBtn.addEventListener("click", () => {
                localStorage.removeItem("authToken");
                localStorage.removeItem("currentUser");
                profileMenu.classList.add("hidden");
                userProfile.classList.add("hidden");
                authActions.classList.remove("hidden");
            });
        }

        const escapeHTML = (value) => { const el = document.createElement("div"); el.textContent = value || ""; return el.innerHTML; };
        const escapeAttr = escapeHTML;
        const formatPrice = (value) => `${Number(value || 0).toLocaleString("vi-VN")} đ`;

        function render(items) {
            if (!items.length) {
                soldList.innerHTML = '<div class="empty-state text-center py-20 text-slate-400 text-lg"><span class="empty-icon text-5xl block mb-3.5">🧾</span>Chưa có tài khoản nào được bán.</div>';
                return;
            }
            soldList.innerHTML = items.map((item) => {
                const soldAt = item.purchasedAt ? new Date(item.purchasedAt) : null;
                const soldTime = soldAt ? soldAt.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
                const soldDate = soldAt ? soldAt.toLocaleDateString("vi-VN") : "";
                return `<article class="history-item sold-history-item bg-gradient-to-b from-[#1a2336]/90 to-[#121824]/95 border border-white/8 rounded-2xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.35)] grid" style="grid-template-columns: 130px minmax(0,1fr) minmax(320px,36%); align-items: start; gap: 16px;">
                    <button type="button" class="history-image-button w-[130px] p-0 border-0 rounded-lg bg-transparent cursor-zoom-in" data-preview-image="${escapeAttr(item.image)}" aria-label="Phóng to ảnh acc">
                        <img src="${escapeAttr(item.image)}" alt="Acc đã bán giá ${escapeAttr(formatPrice(item.price))}" class="w-full h-[86px] object-cover rounded-lg hover:scale-[1.03] hover:brightness-110 transition-all">
                    </button>
                    <div class="history-item-info flex flex-col gap-1.5 min-w-0">
                        <div class="price font-black text-[1.3rem]">${formatPrice(item.price)}</div>
                        ${item.info ? `<p class="card-info-text text-[0.84rem] text-slate-400 leading-relaxed m-0 line-clamp-2">${escapeHTML(item.info)}</p>` : ""}
                        <div class="history-date sold-date-panel text-[0.78rem] text-slate-400 flex flex-col gap-1">
                            <span class="sold-date-label flex items-center gap-1.5 text-slate-400">⏱️ Bán lúc:</span>
                            <strong class="text-slate-100 font-bold text-base">${soldTime}</strong>
                            <span class="sold-date-value text-slate-400">${soldDate}</span>
                        </div>
                    </div>
                    <div class="sold-history-content">
                        <aside class="purchase-login-details flex flex-col gap-2.5 p-3.5 border border-amber-500/35 rounded-lg bg-amber-500/[0.06] text-[0.88rem]" aria-label="Thông tin người mua">
                            <strong class="text-amber-400">👤 Người mua</strong>
                            <div class="purchase-login-row flex items-center justify-between gap-2.5">
                                <code class="px-2 py-1 rounded text-white bg-black/30 border border-white/10 word-break-all font-mono text-sm">${escapeHTML(item.buyerUsername || "***")}</code>
                            </div>
                        </aside>
                    </div>
                </article>`;
            }).join("");
        }

        soldList.addEventListener("click", (event) => {
            const previewButton = event.target.closest(".history-image-button");
            if (!previewButton) return;
            let lightbox = document.getElementById("history-image-lightbox");
            if (!lightbox) {
                lightbox = document.createElement("div");
                lightbox.id = "history-image-lightbox";
                lightbox.className = "history-image-lightbox";
                lightbox.innerHTML = '<button type="button" class="history-image-close fixed top-[18px] right-6 border-0 bg-transparent text-white text-[2.5rem] leading-none cursor-pointer" aria-label="Đóng ảnh phóng to">&times;</button><img alt="Ảnh acc phóng to" class="max-w-[min(1100px,94vw)] max-h-[88vh] object-contain rounded-lg">';
                lightbox.addEventListener("click", (clickEvent) => {
                    if (clickEvent.target === lightbox || clickEvent.target.closest(".history-image-close")) lightbox.classList.remove("active");
                });
                document.body.appendChild(lightbox);
            }
            lightbox.querySelector("img").src = previewButton.dataset.previewImage;
            lightbox.classList.add("active");
        });

        async function loadSoldAccounts() {
            try {
                const response = await fetch(`${API_BASE_URL}/purchases/sold`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Không tải được danh sách.");
                render(data.items || []);
            } catch (error) {
                soldList.innerHTML = `<div class="empty-state text-center py-20 text-slate-400">⚠️ ${escapeHTML(error.message)}</div>`;
            }
        }
        loadSoldAccounts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Shop Acc Liqi</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zv0jlmxj/image/upload/r_max/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tailwind.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div id="toast-container" aria-live="polite"></div>
    <main class="mx-auto my-[70px] max-w-[466px] px-4">
        <section class="modal-card !w-auto !max-w-none pt-16" aria-label="Đăng nhập hoặc đăng ký">
            <a href="../index.html" class="modal-close modal-image-close !absolute !right-3 !top-3 font-sans no-underline" aria-label="Về trang chủ" title="Về trang chủ">&times;</a>
            <div class="auth-tabs">
                <button type="button" id="tab-login" class="auth-tab active">Đăng nhập</button>
                <button type="button" id="tab-register" class="auth-tab">Đăng ký</button>
            </div>
            <form id="login-form">
                <div class="form-group"><label for="username">Tên đăng nhập *</label><input type="text" id="username" required autocomplete="username" placeholder="Nhập tên tài khoản"></div>
                <div class="form-group"><label for="password">Mật khẩu *</label><input type="password" id="password" required autocomplete="current-password" placeholder="Nhập mật khẩu"></div>
                <div id="login-error" class="form-error" role="alert"></div>
                <div class="form-actions"><button type="submit" id="login-submit-btn" class="btn btn-primary w-full">Đăng nhập</button></div>
            </form>
            <form id="register-form" class="hidden">
                <div class="form-group"><label for="reg-username">Tên đăng nhập *</label><input type="text" id="reg-username" required autocomplete="username" placeholder="Chọn tên đăng nhập"></div>
                <div class="form-group"><label for="reg-password">Mật khẩu *</label><input type="password" id="reg-password" required minlength="6" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự"></div>
                <div class="form-group"><label for="reg-password-confirm">Nhập lại mật khẩu *</label><input type="password" id="reg-password-confirm" required minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu"></div>
                <div id="register-error" class="form-error" role="alert"></div>
                <div class="form-actions"><button type="submit" id="register-submit-btn" class="btn btn-primary w-full">Tạo tài khoản</button></div>
            </form>
            <div class="mb-1 mt-[18px] text-center text-ink-muted">— hoặc —</div>
            <!-- Nút vàng tự vẽ nằm dưới; nút thật của Google trong suốt phủ lên trên để nhận click -->
            <div class="group relative h-[46px] w-full">
                <span class="btn btn-primary pointer-events-none h-full w-full group-hover:bg-gold-gradient-hover group-hover:shadow-gold-lg" aria-hidden="true">
                    <span class="grid h-[22px] w-[22px] place-items-center rounded-full bg-white"><svg width="14" height="14" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.3 0 11.600-2.100 15.500-5.700l-7.500-5.800c-2.100 1.400-4.800 2.300-8 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg></span>
                    Đăng nhập bằng Google
                </span>
                <div id="google-btn" class="absolute inset-0 flex origin-top scale-y-[1.15] cursor-pointer justify-center overflow-hidden opacity-[.01]"></div>
            </div>
            <div id="google-error" class="form-error !mt-2 text-center" role="alert"></div>
        </section>
    </main>
    <script src="config.js"></script>
    <script>
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const loginError = document.getElementById("login-error");
        const registerError = document.getElementById("register-error");
        const switchTab = (tab) => {
            const isLogin = tab === "login";
            document.getElementById("tab-login").classList.toggle("active", isLogin);
            document.getElementById("tab-register").classList.toggle("active", !isLogin);
            loginForm.classList.toggle("hidden", !isLogin);
            registerForm.classList.toggle("hidden", isLogin);
        };
        document.getElementById("tab-login").onclick = () => switchTab("login");
        document.getElementById("tab-register").onclick = () => switchTab("register");
        async function request(path, body) {
            const response = await fetch(`${API_BASE_URL}${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Không thể thực hiện yêu cầu.");
            return data;
        }
        function saveSession(data) { localStorage.setItem("authToken", data.token); localStorage.setItem("currentUser", JSON.stringify(data.user)); window.location.href = "../index.html"; }
        // Hiện trạng thái "Đang xử lý..." và khóa nút để Enter/bấm nhiều lần không gửi trùng
        function setBusy(btn, busy, label) {
            btn.disabled = busy;
            btn.innerHTML = busy ? '<span class="spinner"></span>Đang xử lý...' : label;
        }
        loginForm.onsubmit = async (event) => {
            event.preventDefault();
            const btn = document.getElementById("login-submit-btn");
            if (btn.disabled) return;
            loginError.textContent = "";
            setBusy(btn, true);
            try {
                saveSession(await request("/auth/login", { username: username.value.trim(), password: password.value }));
            } catch (error) {
                loginError.textContent = error.message;
                setBusy(btn, false, "Đăng nhập");
            }
        };
        registerForm.onsubmit = async (event) => {
            event.preventDefault();
            const btn = document.getElementById("register-submit-btn");
            if (btn.disabled) return;
            registerError.textContent = "";
            if (regPassword.value !== regPasswordConfirm.value) { registerError.textContent = "Mật khẩu nhập lại không khớp."; return; }
            setBusy(btn, true);
            try {
                saveSession(await request("/auth/register", { username: regUsername.value.trim(), password: regPassword.value }));
            } catch (error) {
                registerError.textContent = error.message;
                setBusy(btn, false, "Tạo tài khoản");
            }
        };
        const username = document.getElementById("username"), password = document.getElementById("password"), regUsername = document.getElementById("reg-username"), regPassword = document.getElementById("reg-password"), regPasswordConfirm = document.getElementById("reg-password-confirm");

        // ===== Đăng nhập bằng Google =====
        async function handleGoogleCredential(response) {
            document.getElementById("google-error").textContent = "";
            try {
                saveSession(await request("/auth/google", { credential: response.credential }));
            } catch (error) {
                document.getElementById("google-error").textContent = error.message;
            }
        }
        window.addEventListener("load", () => {
            if (!window.google || !window.google.accounts) {
                document.getElementById("google-error").textContent = "Không tải được Google. Vui lòng thử lại.";
                return;
            }
            google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
            // Google chỉ nhận chiều rộng bằng pixel (200-400), nên lấy đúng bề rộng ô đăng nhập.
            const googleBtn = document.getElementById("google-btn");
            const googleWidth = Math.max(200, Math.min(400, Math.floor(googleBtn.clientWidth)));
            google.accounts.id.renderButton(googleBtn, {
                theme: "filled_black", size: "large", text: "continue_with", shape: "pill", width: googleWidth,
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Mua Nick - Shop Acc Liqi</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zv0jlmxj/image/upload/r_max/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tailwind.css">
</head>

<body>
    <!-- Header + khung toast: render bởi components.js -->
    <div id="site-header" data-active="history"></div>
    <script src="components.js"></script>

    <main class="mx-auto max-w-[1340px] px-8 pb-20 pt-9 max-lg:px-5 max-lg:pb-14 max-lg:pt-6">
        <h1 class="page-title">📜 Lịch Sử Mua Nick</h1>

        <div class="history-page-card">
            <div id="page-history-content">
                <div id="history-list" class="history-list"></div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="scripts.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const historyListEl = document.getElementById("history-list");
            
            async function loadPageHistory() {
                if (!currentUser) {
                    historyListEl.innerHTML = `
                        <div class="login-notice">
                            <span class="mb-3 block text-[2.5rem]">🔒</span>
                            <p>Vui lòng đăng nhập để xem lịch sử mua nick của bạn.</p>
                            <button class="btn btn-primary" onclick="document.getElementById('login-btn').click()">Đăng Nhập Ngay</button>
                        </div>
                    `;
                    return;
                }

                historyListEl.innerHTML = `<div class="empty-state"><span class="spinner"></span>Đang tải lịch sử mua...</div>`;

                try {
                    const data = await apiFetch("/purchases/me");
                    renderHistoryList(data.items || []);
                } catch (err) {
                    historyListEl.innerHTML = `<div class="empty-state">⚠️ ${escapeHTML(err.message)}</div>`;
                }
            }

            loadPageHistory();

            // Override logout handler to refresh history view
            document.getElementById("profile-logout-btn").addEventListener("click", () => {
                setTimeout(loadPageHistory, 100);
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lịch sử mua nick - Shop Acc Liqi">
    <title>Lịch Sử Mua Nick - Shop Acc Liqi</title>

    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zv0jlmxj/image/upload/r_max/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Spectral:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .page-title {
            font-family: var(--font-display);
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .history-page-card {
            background: var(--bg-elevated);
            border: 1px solid rgba(216, 181, 104, 0.25);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
        }
        .login-notice {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-muted);
        }
        .login-notice button {
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div id="toast-container" aria-live="polite"></div>

    <header class="site-header">
        <div class="top-bar">
            <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="main-nav">
                <span></span><span></span><span></span>
            </button>
            
            <a href="../index.html" class="top-bar-logo" aria-label="Trang chủ">
                <img class="logo" src="https://res.cloudinary.com/zv0jlmxj/image/upload/v1788875838/ChatGPT_Image_20_55_41_8_thg_9_2026.png" alt="Logo">
            </a>
            <nav id="main-nav" class="nav-links">
                <a href="../index.html" class="nav-item">Trang chủ</a>
                <a href="danhsachaccban.html" class="nav-item">Danh sách acc bay</a>
                <a href="naptien.html" class="nav-item">Nạp tiền</a>
                <a href="lichsumuanick.html" class="nav-item active">Lịch sử mua nick</a>
                <a href="baiviet.html" class="nav-item">Bài viết hướng dẫn</a>
                <a href="lienhe.html" class="nav-item">Liên hệ</a>
            </nav>

            <div id="auth-actions">
                <button id="login-btn" class="btn btn-secondary">Đăng Nhập</button>
            </div>

            <div id="user-profile-top" class="user-profile-top hidden">
                <img class="user-avatar" src="https://res.cloudinary.com/zv0jlmxj/image/upload/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png" alt="Avatar">
                <div class="user-details">
                    <span id="user-display" class="user-name"></span>
                    <span class="user-balance">Số dư: <strong id="wallet-balance-display">0 đ</strong></span>
                </div>

                <div id="admin-menu-dropdown" class="admin-menu-dropdown hidden">
                    <button type="button" id="add-acc-btn" class="admin-menu-item admin-only-menu-item">➕ Thêm acc mới</button>
                    <button type="button" id="manage-users-btn" class="admin-menu-item admin-only-menu-item">👤 Quản lý người dùng</button>
                    <button type="button" id="change-password-btn" class="admin-menu-item profile-menu-item">🔐 Đổi mật khẩu</button>
                    <button type="button" id="profile-logout-btn" class="admin-menu-item profile-menu-item profile-logout-item">↪ Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">📜 Lịch Sử Mua Nick</h1>

        <div class="history-page-card">
            <div id="page-history-content">
                <div id="history-list" class="history-list"></div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="scripts.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const historyListEl = document.getElementById("history-list");
            
            async function loadPageHistory() {
                if (!currentUser) {
                    historyListEl.innerHTML = `
                        <div class="login-notice">
                            <span style="font-size: 2.5rem; display: block; margin-bottom: 12px;">🔒</span>
                            <p>Vui lòng đăng nhập để xem lịch sử mua nick của bạn.</p>
                            <button class="btn btn-primary" onclick="document.getElementById('login-btn').click()">Đăng Nhập Ngay</button>
                        </div>
                    `;
                    return;
                }

                historyListEl.innerHTML = `<div class="empty-state"><span class="spinner"></span>Đang tải lịch sử mua...</div>`;

                try {
                    const data = await apiFetch("/purchases/me");
                    renderHistoryList(data.items || []);
                } catch (err) {
                    historyListEl.innerHTML = `<div class="empty-state">⚠️ ${err.message}</div>`;
                }
            }

            loadPageHistory();

            // Override logout handler to refresh history view
            document.getElementById("profile-logout-btn").addEventListener("click", () => {
                setTimeout(loadPageHistory, 100);
            });
        });
    </script>
</body>

</html>
